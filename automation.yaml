apiVersion: automation.learny.technology/v1alpha1
kind: RepositoryAutomation
metadata:
  repository: learny-technologies/homebrew-tap
  profiles: [package-release]
localValidation:
  scopes:
    - id: automation-contract
      paths:
        - ".github/workflows/**"
        - "scripts/validate_local.py"
        - "automation.yaml"
      commands:
        - "actionlint"
        - "git diff --check"
    - id: formula
      paths:
        - "Formula/**"
      commands:
        - "brew style Formula/controlpctl.rb"
        - "brew audit --strict --except=license controlpctl"
    - id: documentation
      paths:
        - "README.md"
        - "automation.yaml"
      commands:
        - "git diff --check"
sourceGate:
  enabled: true
  checkName: Validation gate
artifacts: []
delivery:
  pipelines: []
